<style id="requested-v2-overrides">
/* Requested follow-up refinements only */
.about-list code{font-family:inherit!important;font-size:inherit!important;font-weight:inherit!important;color:inherit!important}
.science-note p{margin:6px 0 0}.science-note p+p{margin-top:10px}.science-note b{color:var(--ink)}
.contact-note a,.about-modal details a{color:var(--vu-blue);text-decoration:underline;text-underline-offset:2px}
</style>

<style id="pdok-aerial-style">
.mappanel{isolation:isolate}
.mapcanvas{position:relative;z-index:1;background:transparent}
.aerial-layer{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .18s ease;background:#dfe6e3}
.mappanel.aerial-active .aerial-layer{opacity:1}
.aerial-layer img{position:absolute;display:block;max-width:none;height:auto;opacity:.72;filter:saturate(.82) contrast(.96) brightness(.96);will-change:left,top,width,height}
.aerial-wash{position:absolute;inset:0;background:rgba(245,247,246,.16);pointer-events:none}
.aerial-attribution{display:none;position:absolute;z-index:2;right:10px;bottom:7px;padding:3px 6px;border-radius:6px;background:rgba(250,252,249,.84);color:#41575b;font:10px/1.25 Arial,sans-serif;backdrop-filter:blur(4px);pointer-events:auto}
.aerial-attribution a{color:inherit;text-decoration:none}
.mappanel.aerial-active .aerial-attribution{display:block}
.mappanel.aerial-active .hint{bottom:38px}
.basemap-control{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:4px 5px 4px 8px;border:1px solid #d2dedbe6;border-radius:8px;background:#fbfcf9e8;backdrop-filter:blur(8px);box-shadow:0 5px 20px #1e3a3d14}
.basemap-control .basemap-label{font-size:12px;color:#52676b;font-weight:700}
.basemap-control .basemap-buttons{display:flex;border:1px solid #cfd9d7;border-radius:6px;overflow:hidden;background:#fff}
.basemap-control button{min-height:30px!important;padding:4px 8px!important;border:0!important;border-radius:0!important;background:#fff!important;box-shadow:none!important;font-size:12px!important;color:#52676b!important}
.basemap-control button+button{border-left:1px solid #cfd9d7!important}
.basemap-control button.active{background:#183036!important;color:#fff!important}
.aerial-status{display:none;position:absolute;z-index:4;top:68px;right:14px;background:#fbfcf9ee;border:1px solid #d2dedb;border-radius:7px;padding:6px 9px;font:12px Arial,sans-serif;color:#52676b;box-shadow:0 5px 18px #1e3a3d14}
.aerial-status.show{display:block}
@media (max-width:930px){.basemap-control{padding-left:5px;gap:4px}.basemap-control .basemap-label{display:none}.basemap-control button{min-height:34px!important;padding:4px 7px!important;font-size:11px!important}.aerial-attribution{font-size:9px;right:7px;bottom:5px}.mappanel.aerial-active .hint{bottom:34px}}
@media (max-width:580px){.toolbar .map-title{max-width:42%!important}.basemap-control button{padding:3px 6px!important}.aerial-status{top:62px;right:10px}}
</style>

<script>
(function(){
  function updateScale(detail){
    var sc=document.querySelector('.map-scale');
    if(!sc||!detail||!detail.kmPerPx) return;
    var target=96, raw=detail.kmPerPx*target,
        pow=Math.pow(10,Math.floor(Math.log10(raw||1))),
        opts=[1,2,5].map(function(v){return v*pow});
    if(raw>=7.5*pow) opts.push(10*pow);
    var best=opts[0];
    for(var ii=0;ii<opts.length;ii++) if(opts[ii]<=raw) best=opts[ii];
    var width=Math.max(24,Math.min(120,best/detail.kmPerPx));
    var bar=sc.querySelector('.bar'), label=sc.querySelector('.label');
    if(bar) bar.style.width=width.toFixed(1)+'px';
    if(label) label.textContent=(best>=1?best.toFixed(best<10&&best%1!==0?1:0):best.toFixed(1))+' km';
  }
  window.addEventListener('iron-map-scale-change',function(ev){updateScale(ev.detail);});

  function enhanceModal(){
    var modal=document.querySelector('.about-modal');
    if(!modal || modal.dataset.eoEnhanced==='1') return;
    modal.dataset.eoEnhanced='1';
    var hdr=modal.querySelector('.about-header');
    if(hdr && !modal.querySelector('.science-note')){
      var note=document.createElement('div'); note.className='science-note';
      note.innerHTML='<strong>How to interpret this product</strong><p>Total Fe includes multiple dissolved, colloidal and particulate iron forms. The map shows empirical estimates based on Sentinel-2 reflectance and environmental context. Sentinel-2 does not measure iron directly. Laboratory observations remain essential for direct chemical measurement, validation and interpretation.</p><p><b>Model robustness.</b> Nested location-grouped: R² 0.676, RMSE 0.663 mg L⁻¹. Spatial-block: R² 0.569, RMSE 0.764 mg L⁻¹. Forward-year: R² 0.682, RMSE 0.632 mg L⁻¹. These evaluations test transfer to other monitoring locations, geographically separated 25 × 25 km areas, and later years (2021–2025), respectively.</p>';
      hdr.insertAdjacentElement('afterend',note);
    }
    var sources=modal.querySelector('.sources-block');
    if(sources && !modal.querySelector('.contact-note')){
      var q=document.createElement('details');
      q.innerHTML='<summary>Technical details</summary><p>The full model uses five spectral and four environmental predictors. Raw predictor names are shown in the predictor list above. Absorption and diffuse-attenuation descriptors were derived using a Quasi-Analytical Algorithm approach. Original QAA reference: Lee, Z. P., Carder, K. L. & Arnone, R. A. (2002), <i>Deriving inherent optical properties from water color: a multiband quasi-analytical algorithm for optically deep waters</i>, Applied Optics 41, 5755–5772.</p><p>For each accepted Sentinel-2 acquisition, total Fe was first estimated for valid 10 m pixels. The mapped value for a KRW water-body segment is the median of the valid pixel-level estimates within that polygon. A segment-date estimate was retained when valid pixels covered at least 10% of the rasterised segment. For access to the pixel-level estimates, contact Marit van Oostende at <a href="mailto:m.van.oostende@vu.nl">m.van.oostende@vu.nl</a>.</p>';
      sources.insertAdjacentElement('beforebegin',q);
      var c=document.createElement('div'); c.className='contact-note';
      c.innerHTML='<strong>Comments or questions?</strong> Contact Marit van Oostende at <a href="mailto:m.van.oostende@vu.nl">m.van.oostende@vu.nl</a>.';
      sources.insertAdjacentElement('beforebegin',c);
    }
  }

  function enhanceBase(){
    var shell=document.querySelector('.shell'); if(!shell) return false;
    var controls=document.querySelector('.controls');
    if(controls && !controls.querySelector('.mobile-controls-toggle')){
      var btn=document.createElement('button'); btn.type='button'; btn.className='mobile-controls-toggle';
      btn.setAttribute('aria-expanded','false'); btn.textContent='Map controls and filters';
      var search=controls.querySelector('.search');
      if(search) search.insertAdjacentElement('afterend',btn); else controls.appendChild(btn);
      btn.addEventListener('click',function(){
        var open=controls.classList.toggle('mobile-controls-open');
        btn.setAttribute('aria-expanded',String(open));
        btn.textContent=open?'Hide map controls':'Map controls and filters';
      });
    }
    if(!document.getElementById('iron-map-enhance-style')){
      var st=document.createElement('style'); st.id='iron-map-enhance-style';
      st.textContent='.map-scale{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;z-index:4;background:rgba(255,255,255,.93);border:1px solid rgba(24,48,54,.18);border-radius:10px;padding:8px 10px 9px;box-shadow:0 6px 18px rgba(24,48,54,.08);font-size:12px;line-height:1.2;pointer-events:none}.map-scale .track{width:120px;height:10px;display:flex;align-items:flex-end;justify-content:center}.map-scale .bar{height:0;border-top:3px solid #183036;border-left:2px solid #183036;border-right:2px solid #183036}.map-scale .label{display:block;margin-top:4px;font-weight:700;color:#183036;text-align:center}@media (max-width:930px){.map-scale{bottom:12px;padding:7px 9px 8px}.map-scale .track{width:96px}}';
      document.head.appendChild(st);
    }
    var mappanel=document.querySelector('.mappanel');
    if(mappanel && !mappanel.querySelector('.map-scale')){
      var sc=document.createElement('div'); sc.className='map-scale';
      sc.innerHTML='<div class="track"><div class="bar" style="width:72px"></div></div><span class="label">20 km</span>';
      mappanel.appendChild(sc);
    }
    if(window.__IRON_MAP_SCALE__) updateScale(window.__IRON_MAP_SCALE__);
    var map=document.querySelector('.mapcanvas');
    if(map){
      map.setAttribute('role','img');
      map.setAttribute('aria-label','Interactive map of estimated total iron in eligible Dutch inland freshwater segments. Use the map controls to zoom or reset, and select a segment for details.');
      map.setAttribute('tabindex','0');
    }
    document.querySelectorAll('.layers button').forEach(function(b){
      b.setAttribute('aria-pressed',String(b.classList.contains('active')));
    });
    document.querySelectorAll('.filters button').forEach(function(b){
      b.setAttribute('aria-pressed',String(b.classList.contains('active')));
    });
    var sourceButton=document.querySelector('.source');
    if(sourceButton){
      var sourceSummary=sourceButton.querySelector('p');
      if(sourceSummary) sourceSummary.remove();
    }
    enhanceModal();
    return true;
  }

  var tries=0;
  var timer=setInterval(function(){
    tries++;
    if(enhanceBase() || tries>200) clearInterval(timer);
  },50);

  document.addEventListener('click',function(ev){
    var src=ev.target.closest&&ev.target.closest('.source');
    if(src) setTimeout(enhanceModal,60);
    if(ev.target.closest&&ev.target.closest('.layers,.filters')) setTimeout(enhanceBase,0);
  });
})();
</script>
